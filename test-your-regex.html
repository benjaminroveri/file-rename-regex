<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batch Rename</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2430;
      --muted: #677084;
      --paper: #fffdf8;
      --line: #d9d7cf;
      --accent: #e9562f;
      --accent-dark: #c83d1d;
      --success: #18794e;
      --warning: #9a6700;
      --shadow: 0 24px 70px rgb(58 46 33 / 14%);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(circle at 12% 12%, rgb(233 86 47 / 13%), transparent 28rem),
        radial-gradient(circle at 90% 86%, rgb(24 121 78 / 10%), transparent 30rem),
        #f3efe6;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(860px, 100%);
      margin: 0 auto;
    }

    header { margin-bottom: 26px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-dark);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 8vw, 5.25rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.94;
    }

    .intro {
      max-width: 620px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .panel {
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid rgb(30 36 48 / 10%);
      border-radius: 24px;
      background: rgb(255 253 248 / 88%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 0.84rem;
      font-weight: 750;
      letter-spacing: 0.02em;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font: 0.95rem/1.5 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    textarea:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgb(233 86 47 / 12%);
    }

    textarea {
      min-height: 230px;
      padding: 14px 16px;
      resize: vertical;
    }

    input { height: 48px; padding: 0 14px; }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 20px;
    }

    .hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    button {
      min-width: 138px;
      min-height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 8px 20px rgb(233 86 47 / 24%);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    button:hover {
      background: var(--accent-dark);
      box-shadow: 0 10px 26px rgb(200 61 29 / 30%);
      transform: translateY(-1px);
    }

    button:active { transform: translateY(1px); }

    button:focus-visible {
      outline: 3px solid rgb(233 86 47 / 28%);
      outline-offset: 3px;
    }

    #status {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    #status.error { color: #b42318; }
    #status.success { color: var(--success); }

    .results {
      display: none;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .results.visible { display: block; }

    .results h2 {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      font-weight: 500;
    }

    .result-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .result-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font: 0.86rem/1.4 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .result-list li.unchanged { opacity: 0.56; }
    .result-list li.conflict { border-color: #e7b75c; background: #fff9e8; }
    .filename { overflow-wrap: anywhere; }
    .arrow { color: var(--accent); font-family: inherit; font-weight: 800; }
    .conflict-note { color: var(--warning); font-family: Inter, sans-serif; font-size: 0.72rem; }

    .regex-vars {
      display: flex;
      grid-column: 1 / -1;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 2px;
    }

    .regex-var {
      padding: 3px 8px;
      border-radius: 6px;
      background: #f1eee7;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .regex-var strong {
      color: var(--accent-dark);
      font-weight: 800;
    }

    @media (max-width: 640px) {
      body { padding: 30px 14px; }
      .fields { grid-template-columns: 1fr; }
      .actions { align-items: flex-start; flex-direction: column; }
      .result-list li { grid-template-columns: 1fr; gap: 4px; }
      .arrow { transform: rotate(90deg); width: max-content; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Pattern utility</p>
      <h1>Batch Rename</h1>
      <p class="intro">Paste one filename per line, define the matching pattern and the new name, then preview every change before using it.</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <form id="rename-form" novalidate>
        <label for="filenames" id="form-title">Filenames</label>
        <textarea id="filenames" name="filenames" spellcheck="false" placeholder="photo_001.jpg&#10;photo_002.jpg&#10;notes.txt"></textarea>

        <div class="fields">
          <div>
            <label for="filter-regex">Match regular expression</label>
            <input id="filter-regex" name="filter" value="^photo_([0-9]+)\.jpg$" spellcheck="false" autocomplete="off">
            <p class="hint">Use parentheses to capture parts of a filename.</p>
          </div>
          <div>
            <label for="rename-template">Rename template</label>
            <input id="rename-template" name="template" value="image_{1}.jpg" spellcheck="false" autocomplete="off">
            <p class="hint">Insert captures with <code>{1}</code>, <code>{2}</code>, and so on.</p>
          </div>
        </div>

        <div class="actions">
          <button type="submit">Execute</button>
          <p id="status" role="status" aria-live="polite">Ready to preview.</p>
        </div>
      </form>

      <section class="results" id="results" aria-labelledby="results-title">
        <h2 id="results-title">Preview</h2>
        <ul class="result-list" id="result-list"></ul>
      </section>
    </section>
  </main>

  <script>
    const form = document.querySelector('#rename-form');
    const filenamesInput = document.querySelector('#filenames');
    const filterInput = document.querySelector('#filter-regex');
    const templateInput = document.querySelector('#rename-template');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    const resultList = document.querySelector('#result-list');

    function setStatus(message, kind = '') {
      status.textContent = message;
      status.className = kind;
    }

    function applyTemplate(template, match) {
      return template.replace(/\{(\d+)\}/g, (token, groupNumber) => {
        const index = Number(groupNumber);
        return index < match.length && match[index] !== undefined ? match[index] : token;
      });
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const filenames = filenamesInput.value
        .split(/\r?\n/)
        .map((name) => name.trim())
        .filter(Boolean);

      resultList.replaceChildren();
      results.classList.remove('visible');

      if (!filenames.length) {
        setStatus('Add at least one filename.', 'error');
        filenamesInput.focus();
        return;
      }

      let filter;
      try {
        filter = new RegExp(filterInput.value);
      } catch (error) {
        setStatus(`Invalid regular expression: ${error.message}`, 'error');
        filterInput.focus();
        return;
      }

      const rows = filenames.map((original) => {
        const match = filter.exec(original);
        return {
          original,
          // renamed: match ? applyTemplate(templateInput.value, match) : original,
          renamed: match ? original.replace(filter, templateInput.value) : original,
          matched: Boolean(match),
          captures: match ? match.slice(1) : []
        };
      });

      const counts = new Map();
      rows.forEach(({ renamed }) => counts.set(renamed, (counts.get(renamed) || 0) + 1));

      let changed = 0;
      let conflicts = 0;

      rows.forEach(({ original, renamed, matched, captures }) => {
        const item = document.createElement('li');
        const isChanged = matched && original !== renamed;
        const isConflict = counts.get(renamed) > 1;

        if (!isChanged) item.classList.add('unchanged');
        if (isConflict) item.classList.add('conflict');
        if (isChanged) changed += 1;
        if (isConflict) conflicts += 1;

        const before = document.createElement('span');
        before.className = 'filename';
        before.textContent = original;

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '→';

        const after = document.createElement('span');
        after.className = 'filename';
        after.textContent = renamed;

        item.append(before, arrow, after);

        if (captures.length) {
          const variables = document.createElement('div');
          variables.className = 'regex-vars';
          variables.setAttribute('aria-label', 'Captured regex variables');

          captures.forEach((value, index) => {
            const variable = document.createElement('span');
            variable.className = 'regex-var';

            const name = document.createElement('strong');
            name.textContent = `{${index + 1}}`;
            variable.append(name, ` = ${value ?? ''}`);
            variables.append(variable);
          });

          item.append(variables);
        }

        if (isConflict) {
          const note = document.createElement('span');
          note.className = 'conflict-note';
          note.textContent = 'Duplicate target';
          after.append(document.createElement('br'), note);
        }

        resultList.append(item);
      });

      results.classList.add('visible');
      const conflictMessage = conflicts ? ` ${conflicts} conflict${conflicts === 1 ? '' : 's'} found.` : '';
      setStatus(`${changed} of ${rows.length} filename${rows.length === 1 ? '' : 's'} would change.${conflictMessage}`, conflicts ? 'error' : 'success');
    });
  </script>
</body>
</html>
